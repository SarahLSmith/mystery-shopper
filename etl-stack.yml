AWSTemplateFormatVersion: 2010-09-09
Description: >
  MysteryShopper S3 Cloudformation example for AWS week in the Data Engineering Software Academy

Parameters:
  YourName:
    Type: String
    Description: Enter your name in format 'first-last' to customise the way your resources are named
    Default: rory-gilmore

#TODO: Add NetworkStackName

Resources:

  # TODO Add EtlLambdaFunction:

  ShopperRawDataBucket:
    Type: AWS::S3::Bucket

    #TODO DependsOn
 
    Properties: 
      BucketName: !Sub '${YourName}-shopper-raw-data'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: True
        BlockPublicPolicy: True
        IgnorePublicAcls: True
        RestrictPublicBuckets: True
        
        #TODO Add NotificationCOnfiguration: # triggers the lambda when a file is put in 
      Tags: 
        - Key: Name 
          Value: !Sub '${YourName}-shopper-raw-data'

  # TODO Add ShopperRawDataBucketPermission: # allow the triggered lambda to read from the bucket
  ShopperRawDataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ShopperRawDataBucket
      PolicyDocument:
        Statement:
          - Sid: EnforceHTTPS
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::${YourName}-shopper-raw-data"
              - !Sub "arn:aws:s3:::${YourName}-shopper-raw-data/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
